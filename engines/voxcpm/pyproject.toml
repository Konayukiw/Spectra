[project]
name = "spectra-engine-voxcpm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "voxcpm==2.0.3",
    "torch==2.10.*",
    "torchaudio==2.10.*",
    "soundfile>=0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
